<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B132B">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Memperbarui KelasKu…</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;background:#061938;color:#fff}body{min-height:100dvh;display:grid;place-items:center;padding:22px}.card{width:min(420px,100%);border:1px solid rgba(78,151,237,.28);border-radius:24px;padding:28px;background:linear-gradient(155deg,#0d3267,#071b3c);box-shadow:0 30px 90px rgba(0,0,0,.38);text-align:center}.mark{width:62px;height:62px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#1769d7,#2ce2cf);font-size:28px;font-weight:900;color:#05213c}.spinner{width:34px;height:34px;margin:20px auto;border:3px solid rgba(255,255,255,.15);border-top-color:#36e2cf;border-radius:50%;animation:spin .8s linear infinite}.card h1{font-size:20px;margin:0}.card p{font-size:12px;line-height:1.65;color:#9eb6cf;margin:8px 0 0}.status{font-size:11px;color:#6ff0dc;margin-top:14px}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<section class="card">
  <div class="mark">K</div>
  <h1>Memperbarui KelasKu</h1>
  <p>Cache aplikasi lama sedang dibersihkan agar versi terbaru benar-benar terpasang.</p>
  <div class="spinner"></div>
  <div id="status" class="status">Menyiapkan pembaruan…</div>
</section>
<script>
(async()=>{
  const status=document.getElementById('status');
  const q=new URLSearchParams(location.search);
  const version=q.get('v')||'';
  const build=q.get('b')||'';
  try{
    status.textContent='Menghapus cache lama…';
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('kelasku-')).map(k=>caches.delete(k)));
    }
    status.textContent='Melepas service worker lama…';
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
  }catch(err){ console.warn('KelasKu recovery:',err); }
  status.textContent='Memuat versi terbaru…';
  const next=new URL('./',location.href);
  next.search='';
  next.hash='';
  if(version)next.searchParams.set('_kkv',version);
  if(build)next.searchParams.set('_kkb',build);
  next.searchParams.set('_fresh',Date.now().toString());
  setTimeout(()=>location.replace(next.href),180);
})();
</script>
</body>
</html>

  <script>
  (function(){
    var legacyHost='ft-financetracker.github.io';
    var primary='https://klasku.my.id';
    if(location.hostname===legacyHost && (location.pathname==='/kelasku' || location.pathname.indexOf('/kelasku/')===0)){
      var path=location.pathname.replace(/^\/kelasku(?=\/|$)/,'') || '/';
      if(path==='/index.html') path='/';
      location.replace(primary + path + location.search + location.hash);
    }
  })();
  </script>
  <base href="/" />
  <script>
  (function(){
    try{
      var ref=(new URLSearchParams(location.search).get('c')||location.pathname.replace(/^\/+|\/+$/g,'')).trim().toLowerCase();
      if(!ref||ref==='links.html'||ref==='index.html')return;
      var raw=localStorage.getItem('kelasku_public_bg_v680_'+ref); if(!raw)return;
      var bg=JSON.parse(raw)||{}; var preset=String(bg.preset||'MIDNIGHT').toUpperCase();
      document.documentElement.dataset.publicBgPreset=preset;
      var mobile=matchMedia('(max-width:720px)').matches; var url=String((mobile?bg.mobile:bg.desktop)||bg.desktop||bg.mobile||'');
      if(url){var preload=document.createElement('link');preload.rel='preload';preload.as='image';preload.href=url;document.head.appendChild(preload);document.documentElement.style.setProperty('--public-class-bg-image','url("'+url.replace(/"/g,'%22')+'")');document.documentElement.classList.add('public-bg-cached');}
    }catch(e){}
  })();
  </script>

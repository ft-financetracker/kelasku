<!doctype html><html><head><meta charset="utf-8"><script src="config.js"></script></head><body id="out">RUNNING</body><script type="module">
import { prepareAvatar } from './src/js/screens/profile.js';
(async()=>{
 try{
  const blob=await fetch('./assets/icons/icon-512.png').then(r=>r.blob());
  const file=new File([blob],'fixture.png',{type:'image/png'});
  const data=await prepareAvatar(file);
  const img=new Image();
  img.onload=()=>{document.body.textContent=(img.naturalWidth===192&&img.naturalHeight===192&&data.length<=36000?'PASS':'FAIL')+' len='+data.length+' size='+img.naturalWidth+'x'+img.naturalHeight+' type='+data.slice(0,30);};
  img.onerror=()=>{document.body.textContent='FAIL image decode';};
  img.src=data;
 }catch(e){document.body.textContent='FAIL '+e.message;}
})();
</script></html>
